[project]
name = "pydiverse-pipedag"
version = "0.12.14"
description = "A pipeline orchestration library executing tasks within one python session. It takes care of SQL table (de)materialization, caching and cache invalidation. Blob storage is supported as well for example for storing model files."
authors = [
  { name = "QuantCo, Inc." },
  { name = "Nicolas Camenisch", email = "garnele007@gmail.com" },
  { name = "Finn Rudolph", email = "finn.rudolph@t-online.de" },
  { name = "Nicolas Mueller", email = "github@nicolasmueller.eu" },
  { name = "Martin Trautmann", email = "windiana@users.sf.net" },
]
license = { file = "LICENSE" }
readme = "docs/package/README.md"
requires-python = ">=3.11.14, <3.15.0a0"

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: SQL",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]

dependencies = [
  "pydiverse-common >=0.4.4,<0.5",
  "typing-extensions >=4.15.0,<5",
  "networkx >=3.4,<4",
  "attrs >=25.4.0,<27",
  "structlog >=25.4.0,<27",
  "pynng >=0.8.1,<0.9",
  "msgpack >=1.1.1,<2",
  "packaging >=26",
  "python-box >=7.3.2,<8",
  "pyyaml >=6.0.3,<7",
  "cryptography >=45.0.7,<50",
  "click >=8.1.8,<9",
  "pyparsing >=3.2.5,<4",
  "sqlalchemy >=2,<3",
  "pandas >=2,<4",
  "pyarrow >=19.0.0,<25",
  "duckdb >=1,<2",
  "duckdb-engine >=0.15.0,<0.16",
  "polars >=1.34.0,<2",
  "fsspec >=2025.9.0,<2027",
  "universal_pathlib >=0.3.2,<0.4",
]

# keep in sync with [package.extra-dependencies.*] in pixi.toml (see .github/scripts/check_deps.sh)
[project.optional-dependencies]
pydot = ["pydot >=4.0.0,<5"]
postgres = ["psycopg2 >=2.9.10"]
postgres-adbc = ["psycopg2 >=2.9.10", "adbc-driver-postgresql >=1.6.0,<2"]
filelock = ["filelock >=3.20.0"]
zookeeper = ["kazoo >=2.8.0"]
# dask is also used by the computation tracer when running all tests
dask = ["dask >=2022.1.0"]
prefect = ["prefect >=3,<4"]
snowflake = ["snowflake-sqlalchemy >=1.6.1", "adbc-driver-snowflake >=1.9.0"]
ibis = [
  "ibis-framework >=10.5.0",
  "ibis-framework[mssql] >=10.5.0",
  "ibis-framework[postgres] >=10.5.0",
]
mssql = [
  "arrow-odbc >=8.1.1,<11",
  "pyodbc >=5.2.0,<6",
  "pytsql >=1.4.0,<2",
  "bcpandas >=2.6.3,<3",
]
pdtransform = ["pydiverse-transform >=0.7.0,<0.8"]
colspec = ["pydiverse-colspec >=0.3.1,<0.4"]
dataframely = ["dataframely >=2.1.0,<3"]
ibm-db = ["ibm-db >=3.3.0,<4", "ibm-db-sa >=0.4.2,<0.5"]
s3 = [
  "s3fs >=2025.5.1,<2027",
  "boto3 >=1.38.13,<2",
  "gcsfs >=2025.9.0,<2027",
  "google-auth >=2.48.0",
]
connectorx = ["connectorx >=0.3.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydiverse"]

[project.scripts]
pipedag-manage = "pydiverse.pipedag.management.cli:cli"

[tool.ruff]
extend-exclude = ["docs/*"]
fix = true
target-version = "py311"
# 88 leads to worse comments
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "UP", "W", "I001", "I002", "B", "A"]
ignore = ["B028"]

[tool.ruff.lint.per-file-ignores]
"src/pydiverse/pipedag/backend/table/sql/ddl.py" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["pydiverse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
