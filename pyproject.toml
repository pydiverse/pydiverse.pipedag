[project]
name = "pydiverse-pipedag"
version = "0.12.14"
description = "A pipeline orchestration library executing tasks within one python session. It takes care of SQL table (de)materialization, caching and cache invalidation. Blob storage is supported as well for example for storing model files."
authors = [
  { name = "QuantCo, Inc." },
  { name = "Nicolas Camenisch", email = "garnele007@gmail.com" },
  { name = "Finn Rudolph", email = "finn.rudolph@t-online.de" },
  { name = "Nicolas Mueller", email = "github@nicolasmueller.eu" },
  { name = "Martin Trautmann", email = "windiana@users.sf.net" },
]
license = { file = "LICENSE" }
readme = "docs/package/README.md"
requires-python = ">=3.11.14, <3.15.0a0"

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: SQL",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]

dependencies = [
  "pydiverse-common >=0.4.4,<0.5",
  "typing-extensions >=4.15.0,<5",
  "networkx >=3.4,<4",
  "attrs >=25.4.0,<27",
  "structlog >=25.4.0,<27",
  "pynng >=0.8.1,<0.9",
  "msgpack >=1.1.1,<2",
  "packaging >=25.0,<26",
  "python-box >=7.3.2,<8",
  "pyyaml >=6.0.3,<7",
  "cryptography >=45.0.7,<50",
  "click >=8.1.8,<9",
  "pyparsing >=3.2.5,<4",
  "sqlalchemy >=1.4.54,<3",
  "pandas >=1.5.3,<4",
  "pyarrow >=19.0.0,<25",
  "duckdb >=0.10.3,<2",             # py311pdsa1 requires < 1
  "duckdb-engine >=0.15.0,<0.16",
  "polars >=1.2.1,<2",              # py311pdsa1all requires < 1.30.0
  "fsspec >=2025.9.0,<2027",
  "universal_pathlib >=0.3.2,<0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydiverse"]

[project.scripts]
pipedag-manage = "pydiverse.pipedag.management.cli:cli"

[tool.ruff]
extend-exclude = ["docs/*"]
fix = true
target-version = "py311"
# 88 leads to worse comments
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "UP", "W", "I001", "I002", "B", "A"]
ignore = ["B028"]

[tool.ruff.lint.per-file-ignores]
"src/pydiverse/pipedag/backend/table/sql/ddl.py" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["pydiverse"]

# Static type checking is scoped to the public API surface assertions in tests/typing.
# `src/` as a whole is not yet type-clean; see docs/source/typing.md.
[tool.pyright]
include = ["tests/typing"]
# Same reason as mypy's `mypy_path`: check the working tree, not whatever happens to be
# installed in the environment.
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingModuleSource = false
# `tests/typing/negative.py` marks every intentional error. Reporting unnecessary
# markers turns "this error stopped being reported" into a failure as well.
reportUnnecessaryTypeIgnoreComment = "error"
# Don't let mypy's `# type: ignore` markers in that file suppress pyright's own
# diagnostics - pyright only honours its own `# pyright: ignore` comments.
enableTypeIgnoreComments = false

[tool.mypy]
files = ["tests/typing"]
# Resolve pipedag from the working tree rather than from an install. Without this, an
# environment that never ran `pixi run postinstall` makes every pipedag name `Any` and
# the whole suite passes vacuously.
mypy_path = "src"
# numpy's bundled stubs use PEP 695 `type` statements, which mypy only parses when
# targeting 3.12+. pyright is the authoritative checker and does run against the 3.11
# floor.
python_version = "3.12"
ignore_missing_imports = true
# pandas ships no py.typed marker, so without this mypy treats pd.DataFrame as `Any` and
# the assertions about `as_type=pd.DataFrame` become vacuous.
follow_untyped_imports = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# Analyse pipedag itself for types, but don't report its own diagnostics: `src/` is not
# type-clean yet, and pyright's `include` already scopes reporting the same way.
[[tool.mypy.overrides]]
module = "pydiverse.*"
follow_imports = "silent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
