exclude: ^.pixi$
repos:
  - repo: local
    hooks:
      # ensure pixi environments are up to date
      # workaround for https://github.com/prefix-dev/pixi/issues/1482
      # the hooks below use `pixi run --as-is`, so this is the only hook that needs network access
      - id: pixi-install
        name: pixi-install
        entry: pixi install -e default -e typecheck
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
      # ruff
      - id: ruff-format
        name: ruff-format
        entry: pixi run --as-is ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff
        name: ruff
        entry: pixi run --as-is ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # type checking (scoped to tests/type_checking via pyproject.toml; pyright is authoritative)
      - id: pyright
        name: pyright
        entry: pixi run --as-is -e typecheck pyright
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: pixi run --as-is -e typecheck mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
      - id: tombi
        name: tombi
        entry: pixi run --as-is tombi format --offline
        language: system
        types: [toml]
      - id: trailing-whitespace-fixer
        name: trailing-whitespace-fixer
        entry: pixi run --as-is trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: pixi run --as-is end-of-file-fixer
        language: system
        types: [text]
      - id: check-merge-conflict
        name: check-merge-conflict
        entry: pixi run --as-is check-merge-conflict --assume-in-merge
        language: system
        types: [text]
        exclude: ".rst$"
      # typos
      - id: typos
        name: typos
        entry: pixi run --as-is typos --force-exclude
        language: system
        types: [text]
        require_serial: true
      # insert-license
      - id: insert-license
        name: insert-license
        entry: >-
          pixi run --as-is
          insert-license
          --license-base64 Q29weXJpZ2h0IChjKSBRdWFudENvIGFuZCBweWRpdmVyc2UgY29udHJpYnV0b3JzIDIwMjUtMjAyNQpTUERYLUxpY2Vuc2UtSWRlbnRpZmllcjogQlNELTMtQ2xhdXNlCg==
          --dynamic-years
          --comment-style "#"
        language: system
        types: [python]
