[workspace]
name = "pydiverse-pidepag"
channels = ["conda-forge"]
exclude-newer = "7d"
preview = ["pixi-build"]
platforms = ["linux-64", "osx-arm64", "win-64"] # "linux-aarch64"

[exclude-newer]
pydiverse-transform = "0d"
pydiverse-common = "0d"
pydiverse-colspec = "0d"

[package]
name = "pydiverse-pipedag"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
python = ">=3.11"
hatchling = "*"
uv = "*"

[package.run-dependencies]
python = ">=3.11"
pydiverse-common = ">=0.4.4,<0.5"
typing-extensions = ">=4.15.0,<5"
networkx = ">=3.4,<4"              # Why needed?
attrs = ">=25.4.0,<27"
structlog = ">=25.4.0,<27"
pynng = ">=0.8.1,<0.9"
msgpack-python = ">=1.1.1,<2"
packaging = ">=26"
python-box = ">=7.3.2,<8"
pyyaml = ">=6.0.3,<7"
cryptography = ">=45.0.7,<50"      # Why explicit?
click = ">=8.1.8,<9"
pyparsing = ">=3.2.5,<4"
sqlalchemy = ">=2,<3"
pandas = ">=2,<4"                  # maybe extra?
pyarrow = ">=19.0.0,<25"           # maybe extra?
python-duckdb = ">=1,<2"           # extra
duckdb-engine = ">=0.15.0,<0.16"   # extra
polars = ">=1.34.0,<2"             # maybe extra?
fsspec = ">=2025.9.0,<2027"        # extra
universal_pathlib = ">=0.3.2,<0.4"

[package.extra-dependencies.pydot]
pydot = ">=4.0.0,<5"

[package.extra-dependencies.postgres]
psycopg2 = ">=2.9.10"

[package.extra-dependencies.postgres-adbc]
psycopg2 = ">=2.9.10"
adbc-driver-postgresql = ">=1.6.0,<2"

[package.extra-dependencies.filelock]
filelock = ">=3.20.0"

# TODO: Remove?
[package.extra-dependencies.zookeeper]
kazoo = ">=2.8.0"

# TODO: Remove?
[package.extra-dependencies.dask]
# is also used by computation tracer when running all tests
dask = ">=2022.1.0"

# Todo: remove?
[package.extra-dependencies.prefect]
prefect = ">=2.14.2,<4a0"

[package.extra-dependencies.snowflake]
snowflake-sqlalchemy = ">=1.6.1"
adbc-driver-snowflake = ">=1.9.0"
# TODO: Do we need a no-adbc version?

# TODO: Remove?
[package.extra-dependencies.ibis]
# Table Hooks
ibis-framework = ">=10.5.0"
ibis-mssql = ">=10.5.0"
ibis-postgres = ">=10.5.0"

[package.extra-dependencies.mssql]
arrow-odbc = ">=8.1.1,<11"
pyodbc = ">=5.2.0,<6"
pytsql = ">=1.4.0,<2"
bcpandas = ">=2.6.3,<3"
# conda-forge only ships bcpandas <=2.6.x, which imports the removed pkg_resources at load time.
# Pin setuptools <81 so pkg_resources stays available.
setuptools = "<81"
python = "<3.14"   # odbc packages are not compatible, yet

[package.extra-dependencies.pdtransform]
pydiverse-transform = ">=0.7.0,<0.8"

[package.extra-dependencies.colspec]
pydiverse-colspec = ">=0.3.1,<0.4"

[package.extra-dependencies.dataframely]
dataframely = ">=2.1.0,<3"

[package.extra-dependencies.ibm-db]
ibm_db = ">=3.2.5,<4"
ibm_db_sa = ">=0.3.8"

# S3 / GCS
[package.extra-dependencies.s3]
s3fs = ">=2025.5.1,<2027"
boto3 = ">=1.38.13,<2"
gcsfs = ">=2025.9.0,<2027"
google-auth = ">=2.48.0"

[package.extra-dependencies.connectorx]
# TODO: remove?
connectorx = ">=0.3.3"

[dependencies]
pydiverse-pipedag = { path = "." }

[tasks]
zip-examples = "sh -c 'set -ex; for d in example*; do if test -f $d/run_pipeline.py; then echo $d; cd $d; pixi update; pixi install; cd -; rm -r $d/.pixi $d/__pycache__ || echo ignore; rm docs/source/examples/zip/$d.zip || echo $d.zip is new; zip -r docs/source/examples/zip/$d.zip $d/; fi; done'"

[feature.dev.dependencies]
pytest = ">=7.2.0"
pytest-mock = ">=3.10.0"
pytest-timeout = ">=2.1.0"
ruff = ">=0.5.1"
pre-commit = ">=3.7.1"
# XGBoost is used by some relistic pipeline examples
xgboost = ">=3.0.2"

[feature.docs.dependencies]
sphinx = ">=8.2.3"
furo = ">=2024.8.6"
sphinxcontrib-apidoc = ">=0.3.0"
myst-parser = ">=4.0.1"
sphinx-autosummary-accessors = ">=2025.3.1"
sphinx-click = ">=6.0.0"
sphinx-autobuild = ">=2024.10.3"
sphinx-copybutton = ">=0.5.2"

[feature.docs.tasks]
docs = "cd docs && make html "
readthedocs = "rm -rf $READTHEDOCS_OUTPUT/html && cp -r docs/build/html $READTHEDOCS_OUTPUT/html"

[feature.release.dependencies]
hatch = ">=1.12.0"
twine = ">=7.0.0"
python = ">=3.14"

[feature.lint.dependencies]
pre-commit = "*"
insert-license-header = "*"
docformatter = "*"
ruff = ">=0.5.6"
prettier = "*"
nbstripout = "*"
sqlfluff = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
conda-deny = "*"
go-yq = "*"

[feature.lint.tasks]
pre-commit-install = "pre-commit install"
lint = "pre-commit run -a"
conda-deny-check = "conda-deny check"
check-deps = "sh -c .github/scripts/check_deps.sh"

[feature.all.dependencies]
pydiverse-pipedag = { path = ".", extras = [
  "pydot",
  "postgres",
  "postgres-adbc",
  "filelock",
  "zookeeper",
  "dask",
  # "prefect",
  # "snowflake",
  "ibis",
  # "mssql",
  "pdtransform",
  "colspec",
  "dataframely",
  # "ibm-db",
  "s3",
  "connectorx",
] }

[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[feature.pd3.constraints]
pandas = "3.*"

[feature.old.constraints]
# pandas = "2.*"

[environments]
default = ["lint", "dev", "release", "all"]
py311 = ["dev", "py311", "all"]
py312 = ["dev", "py312", "all"]
py313 = ["dev", "py313", "all"]
py314 = ["dev", "py314", "all"]
new = ["dev", "py314", "all", "pd3"]
# todo: use lowest-direct once we fix https://github.com/prefix-dev/pixi/issues/5386
# TODO: write linter that checks that all dependencies are exactly on their lowest version and if not,
# tells the user to adjust the lower bounds of the package
old = { features = ["dev", "all", "old"], solve-strategy = "lowest" }
docs = ["docs"]
