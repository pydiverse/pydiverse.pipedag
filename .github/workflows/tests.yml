name: Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches:
      - '**'

# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit Checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
      - name: pre-commit
        run: pixi run pre-commit run -a --color=always --show-diff-on-failure
      - name: Check pyproject.toml dependencies
        run: pixi run check-deps

  import_test:
    name: Import Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          environments: no-features
      # the no-features environment has none of the optional dependencies installed
      - name: Import pipedag
        run: pixi run -e no-features python -c "from pydiverse.pipedag import *"
      - name: Run CLI
        run: pixi run -e no-features pipedag-manage --help

  # Every test environment ships all optional dependencies, so the matrix is backend x
  # environment. `old` additionally resolves every dependency to its lowest version to
  # catch violated lower version bounds.
  test:
    name: ${{ matrix.backend }} (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [Postgres, DuckDB, S3, MSSql, DB2]
        environment: [py311, py312, py313, py314, old]
        exclude:
          # ibm_db is not available for python 3.14, yet
          - backend: DB2
            environment: py314
        include:
          # these entries match a backend from the matrix above and only add its settings
          - backend: Postgres
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb
          - backend: DuckDB
            docker-services: |
              zoo
              minio
            pytest-arguments: --ibis --pdtransform --no-postgres --no-lock_tests
          - backend: S3
            docker-services: |
              postgres
              minio
              zoo
            pytest-arguments: --s3 --ibis --pdtransform --no-duckdb --no-postgres --no-lock_tests
          - backend: MSSql
            docker-services: |
              mssql
              zoo
            pytest-arguments: --mssql -m mssql --ibis --pdtransform --no-postgres --no-duckdb
          # --ibis is not supported
          - backend: DB2
            docker-services: ibm_db2
            pytest-arguments: --ibm_db2 -m ibm_db2 --pdtransform --no-postgres --no-duckdb

          # these entries don't match the matrix above, so each one is a single extra job
          # without postgres-adbc and dataframely to cover the fallback code paths
          - backend: Postgres
            environment: no-adbc-dy
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb
          # prefect is currently not part of any environment
          - backend: Orchestration
            environment: py313
            docker-services: |
              postgres
              zoo
            pytest-arguments: --dask -m dask
          - backend: Orchestration
            environment: old
            docker-services: |
              postgres
              zoo
            pytest-arguments: --dask -m dask
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          environments: ${{ matrix.environment }}

      - name: Start Docker Compose
        if: ${{ matrix.docker-services != '' }}
        uses: isbang/compose-action@248470ecc5ed40d8ed3d4480d8260d77179ef579
        with:
          compose-file: docker-compose.yaml
          services: ${{ matrix.docker-services }}

      - name: Install Microsoft ODBC
        if: ${{ contains(matrix.docker-services, 'mssql') }}
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo /opt/mssql-tools18/bin >> $GITHUB_PATH

      - name: Test BCP
        if: ${{ contains(matrix.docker-services, 'mssql') }}
        run: bcp -v

      - name: Wait for Docker Servers
        if: ${{ matrix.docker-services != '' }}
        run: |
          # store the (possibly multiline) input in a variable
          services="${{ matrix.docker-services }}"
          # replace every newline with a single space
          services="${services//$'\n'/ }"
          until bash ./.github/scripts/docker_compose_ready.sh ${services}; do
            sleep 1
          done

      - name: Run tests
        env:
          ERROR_ONLY: 1
          LOG_TEST_NAME: 1
        run: pixi run -e ${{ matrix.environment }} pytest tests ${RUNNER_DEBUG:+-v} --color=yes --workers=4 ${{ matrix.pytest-arguments }}

  # separate job, so that only it gets the snowflake credentials and it is skipped on forks
  snowflake:
    name: Snowflake (no-win)
    # don't execute on forks due to missing credentials
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          # snowflake is only part of no-win (no windows build of libadbc-driver-snowflake)
          environments: no-win

      - name: Start Docker Compose
        uses: isbang/compose-action@248470ecc5ed40d8ed3d4480d8260d77179ef579
        with:
          compose-file: docker-compose.yaml
          services: |
            postgres
            zoo

      - name: Wait for Docker Servers
        run: |
          until bash ./.github/scripts/docker_compose_ready.sh postgres zoo; do
            sleep 1
          done

      - name: Run tests
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          # ends up in a snowflake database name, which must not contain dashes
          SNOWFLAKE_DB_SUFFIX: no_win
          ERROR_ONLY: 1
          LOG_TEST_NAME: 1
        # tests are often waiting on snowflake, so more workers don't help
        run: pixi run -e no-win pytest tests ${RUNNER_DEBUG:+-v} --color=yes --workers=1 --ibis --pdtransform --snowflake --no-postgres --no-duckdb

  # single job to require in the branch protection rules (the matrix job names change often)
  all_green:
    name: All Checks Passed
    if: always()
    needs:
      - lint
      - import_test
      - test
      - snowflake
    runs-on: ubuntu-latest
    steps:
      - name: Check that no job failed
        run: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
