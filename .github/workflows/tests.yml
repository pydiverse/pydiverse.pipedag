name: Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches:
      - '**'

# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit Checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
      - name: pre-commit
        run: pixi run pre-commit run -a --color=always --show-diff-on-failure
      - name: Check pyproject.toml dependencies
        run: pixi run check-deps

  import_test:
    name: Import Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          environments: no-features
      # the no-features environment has none of the optional dependencies installed
      - name: Import pipedag
        run: pixi run -e no-features python -c "from pydiverse.pipedag import *"
      - name: Run CLI
        run: pixi run -e no-features pipedag-manage --help

  smoke_test:
    name: Smoke Test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            environment: py314
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      environment: ${{ matrix.environment }}
      docker-services: |
        postgres
        zoo
        minio

  # Every test environment ships all optional dependencies, so the only axis left is the
  # python version. `old` additionally resolves every dependency to its lowest version;
  # postgres and duckdb are enough to catch violated lower version bounds.
  test:
    name: ${{ matrix.suite }} (${{ matrix.environment }})
    needs: [smoke_test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            environment: py311
            suite: Postgres
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb
          - os: ubuntu-latest
            environment: py312
            suite: Postgres
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb
          - os: ubuntu-latest
            environment: py313
            suite: Postgres
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb
          - os: ubuntu-latest
            environment: py314
            suite: Postgres
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb
          - os: ubuntu-latest
            environment: old
            suite: Postgres
            docker-services: |
              postgres
              zoo
            pytest-arguments: --ibis --pdtransform --no-duckdb

          - os: ubuntu-latest
            environment: py311
            suite: DuckDB
            docker-services: |
              zoo
              minio
            pytest-arguments: --ibis --pdtransform --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: py312
            suite: DuckDB
            docker-services: |
              zoo
              minio
            pytest-arguments: --ibis --pdtransform --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: py313
            suite: DuckDB
            docker-services: |
              zoo
              minio
            pytest-arguments: --ibis --pdtransform --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: py314
            suite: DuckDB
            docker-services: |
              zoo
              minio
            pytest-arguments: --ibis --pdtransform --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: old
            suite: DuckDB
            docker-services: |
              zoo
              minio
            pytest-arguments: --ibis --pdtransform --no-postgres --no-lock_tests

          - os: ubuntu-latest
            environment: py311
            suite: S3
            docker-services: |
              postgres
              minio
              zoo
            pytest-arguments: --s3 --ibis --pdtransform --no-duckdb --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: py312
            suite: S3
            docker-services: |
              postgres
              minio
              zoo
            pytest-arguments: --s3 --ibis --pdtransform --no-duckdb --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: py313
            suite: S3
            docker-services: |
              postgres
              minio
              zoo
            pytest-arguments: --s3 --ibis --pdtransform --no-duckdb --no-postgres --no-lock_tests
          - os: ubuntu-latest
            environment: py314
            suite: S3
            docker-services: |
              postgres
              minio
              zoo
            pytest-arguments: --s3 --ibis --pdtransform --no-duckdb --no-postgres --no-lock_tests

          - os: ubuntu-latest
            environment: py311
            suite: MSSql
            docker-services: |
              mssql
              zoo
            pytest-arguments: --mssql -m mssql --ibis --pdtransform --no-postgres --no-duckdb
          - os: ubuntu-latest
            environment: py312
            suite: MSSql
            docker-services: |
              mssql
              zoo
            pytest-arguments: --mssql -m mssql --ibis --pdtransform --no-postgres --no-duckdb
          - os: ubuntu-latest
            environment: py313
            suite: MSSql
            docker-services: |
              mssql
              zoo
            pytest-arguments: --mssql -m mssql --ibis --pdtransform --no-postgres --no-duckdb
          - os: ubuntu-latest
            environment: py314
            suite: MSSql
            docker-services: |
              mssql
              zoo
            pytest-arguments: --mssql -m mssql --ibis --pdtransform --no-postgres --no-duckdb
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      environment: ${{ matrix.environment }}
      docker-services: ${{ matrix.docker-services }}
      pytest-arguments: ${{ matrix.pytest-arguments }}

  db2_test:
    name: DB2 (${{ matrix.environment }})
    needs: [smoke_test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ibm_db is not available for python 3.14, yet
          - os: ubuntu-latest
            environment: py311
          - os: ubuntu-latest
            environment: py313
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      environment: ${{ matrix.environment }}
      docker-services: ibm_db2
      # --ibis is not supported
      pytest-arguments: --ibm_db2 -m ibm_db2 --pdtransform --no-postgres --no-duckdb

  orchestration_test:
    name: Orchestration
    needs: [smoke_test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            environment: py313
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      environment: ${{ matrix.environment }}
      docker-services: |
        postgres
        zoo
      # prefect is currently not part of any environment
      pytest-arguments: --dask -m dask

  snowflake_test:
    name: Snowflake
    needs: [smoke_test]
    # don't execute on forks due to missing credentials
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        include:
          # snowflake is only part of no-win (no windows build of libadbc-driver-snowflake)
          - os: ubuntu-latest
            environment: no-win
    uses: ./.github/workflows/test.yml
    secrets:
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    with:
      os: ${{ matrix.os }}
      environment: ${{ matrix.environment }}
      workers: 1  # tests are often waiting on snowflake
      timeout-minutes: 50
      docker-services: |
        postgres
        zoo
      pytest-arguments: --ibis --pdtransform --snowflake --no-postgres --no-duckdb

  # single job to require in the branch protection rules (the matrix job names change often)
  all_green:
    name: All Checks Passed
    if: always()
    needs:
      - lint
      - import_test
      - smoke_test
      - test
      - db2_test
      - orchestration_test
      - snowflake_test
    runs-on: ubuntu-latest
    steps:
      - name: Check that no job failed
        run: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
